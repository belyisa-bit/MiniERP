<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MiniERP</title><link rel="stylesheet" href="/css/style.css"></head><body><header><h1>MiniERP</h1><p>Estoque, vendas e financeiro em um só lugar.</p></header><main><section class="cards"><article><span>Entradas</span><strong id="entradas">R$ 0,00</strong></article><article><span>Saídas</span><strong id="saidas">R$ 0,00</strong></article><article><span>Saldo</span><strong id="saldo">R$ 0,00</strong></article></section><p id="mensagem" role="status"></p><div class="grid"><section><h2>Produtos</h2><form id="form-produto"><label>Nome<input name="nome" required></label><label>Quantidade<input name="quantidade" type="number" min="0" required></label><label>Preço<input name="preco" type="number" min="0" step=".01" required></label><button>Adicionar produto</button></form><div class="tabela"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Preço</th><th></th></tr></thead><tbody id="produtos"></tbody></table></div></section><section><h2>Registrar venda</h2><form id="form-venda"><label>Produto<select id="produto-venda" required></select></label><label>Quantidade<input id="quantidade-venda" type="number" min="1" value="1" required></label><button>Adicionar ao carrinho</button></form><ul id="carrinho" class="lista-vazia"><li>O carrinho está vazio.</li></ul><div class="total">Total: <strong id="total-venda">R$ 0,00</strong></div><button id="confirmar-venda" class="destaque" disabled>Confirmar venda</button></section><section><h2>Lançamento manual</h2><form id="form-financeiro"><label>Tipo<select name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></label><label>Valor<input name="valor" type="number" min=".01" step=".01" required></label><label>Descrição<input name="descricao" required></label><button>Salvar lançamento</button></form><h3>Últimos lançamentos</h3><ul id="lancamentos" class="lista-vazia"><li>Nenhum lançamento.</li></ul></section></div></main><script src="/js/script.js"></script></body></html>
